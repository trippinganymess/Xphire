name: Job Scout AI - Internships

on:
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Worker
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_FORM_URL: ${{ secrets.GOOGLE_FORM_URL }}
          GOOGLE_ENTRY_COMPANY: ${{ secrets.GOOGLE_ENTRY_COMPANY }}
          GOOGLE_ENTRY_TITLE: ${{ secrets.GOOGLE_ENTRY_TITLE }}
          GOOGLE_ENTRY_LINK: ${{ secrets.GOOGLE_ENTRY_LINK }}
          # Optional: set PROXY_URL as a single proxy, or a comma-separated
          # list ("http://a:b@host1:port,http://a:b@host2:port") for JobSpy
          # to round-robin through. Leave unset to scrape direct.
          PROXY_URL: ${{ secrets.PROXY_URL }}

        run: python worker_ATS.py.