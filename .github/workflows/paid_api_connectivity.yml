name: Xphire Paid Job API Connectivity

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xphire-paid-job-api-connectivity
  cancel-in-progress: false

jobs:
  connectivity:
    name: Prove both APIs before database integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline probe regressions (no credentials or network)
        run: python -m unittest discover -s tests -p test_paid_api_connectivity.py -v
      - name: One real request to each API
        env:
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY || secrets.X_API_KEY }}
          THEIRSTACK_API_KEY: ${{ secrets.THEIRSTACK_API_KEY || secrets.THEIR_STACK_API_KEY }}
        run: python scripts/test_paid_job_apis.py --report paid-api-connectivity-report.json
      - name: Retain sanitized connectivity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paid-api-connectivity-report
          path: paid-api-connectivity-report.json
          if-no-files-found: warn
          retention-days: 7
