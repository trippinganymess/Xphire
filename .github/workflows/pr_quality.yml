name: PR Quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint and offline regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install locked development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Dependency consistency
        run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Offline regressions
        run: python -m pytest -q
      - name: Dependency advisories
        run: python -m pip_audit --disable-pip -r requirements-dev.txt

  refresh-database:
    name: Refresh lease SQL and permissions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: offline-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: offline-test-password
    steps:
      - uses: actions/checkout@v4
      - name: Create synthetic Supabase roles
        run: psql -v ON_ERROR_STOP=1 -c 'create role anon; create role authenticated; create role service_role;'
      - name: Apply and test refresh lease in disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/003_job_refresh_lease.sql -f tests/job-refresh-lease.sql

  frontend:
    name: Frontend type, lint, build and mocked browser regressions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Type check
        run: npm run typecheck
      - name: Lint (warnings fail)
        run: npm run lint
      - name: Build without credentials
        env:
          VITE_SUPABASE_URL: https://supabase.test
          VITE_SUPABASE_ANON_KEY: offline-test-key-not-a-credential
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Refresh Edge Function offline regressions
        run: node --test ../tests/job-refresh.test.mjs
      - name: Refresh handler type check
        run: npx tsc --ignoreConfig --noEmit --strict --target ES2022 --module nodenext --skipLibCheck ../supabase/functions/refresh-jobs/handler.ts
      - name: Mocked browser regressions
        run: npm test
      - name: Dependency advisories (including build tools)
        run: npm audit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  documentation:
    name: Documentation links and ticket contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_docs.py
