name: Deploy Frontend to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy_frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Cloudflare
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Application
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://gwrrpxvkzsxbakbhnuuc.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3cnJweHZrenN4YmFrYmhudXVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMDY4MjksImV4cCI6MjA5OTg4MjgyOX0.TFFhCjn9qd7MyAkPzwyTaAnLAmBYNsDpwCLFhXb0WU8' }}
        run: npm run build

      - name: Deploy to Cloudflare Workers (Static Assets)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
