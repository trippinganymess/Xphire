
name: Xphire AI - Scheduled Email Digest

on:
  schedule:
    # Runs at 00:00, 06:00, 12:00, 18:00 UTC every day.
    # Users choose which slot they want (IST: 5:30 AM / 11:30 AM / 5:30 PM / 11:30 PM).
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:  # Manual trigger for testing

jobs:
  scheduled-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scheduled Email Dispatcher
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python -m workers.worker_schedule
