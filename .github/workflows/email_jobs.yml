name: FreshLab AI - Email on Demand

on:
  workflow_dispatch:
    inputs:
      job_title:
        description: 'Job title to search (e.g. Backend Engineer, ML Engineer)'
        required: true
        default: 'Software Engineer'
      recipient_email:
        description: 'Email address to deliver results to'
        required: true

jobs:
  email-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unified Email Pipeline
        env:
          PYTHONUNBUFFERED: "1"
          JOB_TITLE: ${{ github.event.inputs.job_title }}
          RECIPIENT_EMAIL: ${{ github.event.inputs.recipient_email }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python worker_email.py
