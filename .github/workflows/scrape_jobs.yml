name: Scrape Jobs (10 min)

on:
  schedule:
    # Every 10 minutes (UTC)
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Scheduled and manual scrapes share a lock; never cancel a running refresh.
concurrency:
  group: scrape-jobs
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SCRAPE_KEYWORDS: ${{ secrets.SCRAPE_KEYWORDS }}

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper worker
        run: python workers/worker_scrape.py
